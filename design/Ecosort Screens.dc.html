<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#d9ddd2;font-family:'Outfit',sans-serif;color:#1e3319}a{color:#4a7a2c}a:hover{color:#1e3319}</style>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#4a7a2c"></rect><circle cx="50" cy="50" r="20" fill="#eef0e9" stroke="#1e3319" stroke-width="4"></circle></svg></template>
</helmet>
<section style="padding:64px;display:flex;flex-direction:column;gap:28px">
  <h2 style="margin:0;font-size:28px;font-weight:800;letter-spacing:-0.02em">Hero banner</h2>
  <div style="display:flex;flex-wrap:wrap;gap:56px;align-items:flex-start">
    <div id="6a" style="display:flex;flex-direction:column;gap:12px">
      <span style="align-self:flex-start;background:#1e3319;color:#fff;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600">6a · Hero · Desktop</span>
      <div style="width:1280px;border:2px solid #1e3319;border-radius:16px;overflow:hidden">
        <dc-import name="Ecosort Hero v4" embedded="{{ true }}" hint-size="1280px,3200px"></dc-import>
      </div>
    </div>
    <div id="6b" style="display:flex;flex-direction:column;gap:12px">
      <span style="align-self:flex-start;background:#1e3319;color:#fff;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600">6b · Hero · Mobile</span>
      <div style="width:390px;border:2px solid #1e3319;border-radius:36px;overflow:hidden">
        <dc-import name="Ecosort Hero v4" mobile="{{ true }}" embedded="{{ true }}" hint-size="390px,6000px"></dc-import>
      </div>
    </div>
  </div>
</section>
<section style="padding:0 64px 0;display:flex;flex-direction:column;gap:28px">
  <h2 style="margin:0;font-size:28px;font-weight:800;letter-spacing:-0.02em">Achievements and garden</h2>
  <div style="display:flex;flex-wrap:wrap;gap:56px;align-items:flex-start">
    <div id="5a" style="display:flex;flex-direction:column;gap:12px">
      <span style="align-self:flex-start;background:#1e3319;color:#fff;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600">5a · Achievements · Desktop, garden open</span>
      <div style="width:1180px;border:2px solid #1e3319;border-radius:16px;overflow:hidden">
        <dc-import name="Ecosort Achievements" garden-open="{{ true }}" hint-size="1180px,1700px"></dc-import>
      </div>
    </div>
    <div id="5b" style="display:flex;flex-direction:column;gap:12px">
      <span style="align-self:flex-start;background:#1e3319;color:#fff;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600">5b · Achievements · Mobile</span>
      <div style="width:390px;border:2px solid #1e3319;border-radius:36px;overflow:hidden">
        <dc-import name="Ecosort Achievements" hint-size="390px,2400px"></dc-import>
      </div>
    </div>
  </div>
</section>
<section style="padding:64px 64px 0;display:flex;flex-direction:column;gap:28px">
  <h2 style="margin:0;font-size:28px;font-weight:800;letter-spacing:-0.02em">Game screen · tabletop</h2>
  <div style="display:flex;flex-wrap:wrap;gap:56px;align-items:flex-start">
    <div id="4a" style="display:flex;flex-direction:column;gap:12px">
      <span style="align-self:flex-start;background:#1e3319;color:#fff;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600">4a · Game · Desktop</span>
      <div style="width:1180px;border:2px solid #1e3319;border-radius:16px;overflow:hidden">
        <dc-import name="Ecosort Game v2" mobile="{{ false }}" embedded="{{ true }}" hint-size="1180px,980px"></dc-import>
      </div>
    </div>
    <div id="4b" style="display:flex;flex-direction:column;gap:12px">
      <span style="align-self:flex-start;background:#1e3319;color:#fff;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600">4b · Game · Mobile</span>
      <div style="width:390px;border:2px solid #1e3319;border-radius:36px;overflow:hidden">
        <dc-import name="Ecosort Game v2" mobile="{{ true }}" embedded="{{ true }}" hint-size="390px,920px"></dc-import>
      </div>
    </div>
  </div>
</section>

</x-dc>
</body>
</html>
